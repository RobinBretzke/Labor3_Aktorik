name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install pyinstaller pyserial

      - name: EXE bauen
        run: |
          pyinstaller --onefile --windowed --name "Drehzahl_Monitor" Code/Labor3_Drehzahl.py
          pyinstaller --onefile --windowed --name "Labor3_3Rev" Code/Labor3_3Rev.py

      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Drehzahl_Monitor_EXE
          path: |
            dist/Drehzahl_Monitor.exe
            dist/Labor3_3Rev.exe
